name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Publish Launcher
      run: dotnet publish src/ManiaLauncher/ManiaLauncher.csproj -c Release -r win-x64 --self-contained false -o artifacts/launcher

    - name: Publish Installer
      run: dotnet publish src/ManiaLauncher.Installer/ManiaLauncher.Installer.csproj -c Release -r win-x64 --self-contained false -o artifacts/installer

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ManiaLauncher
        path: artifacts/
